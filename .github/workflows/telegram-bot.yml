name: Telegram bot commands

# Started instantly by the Cloudflare Worker when you DM the bot.
on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts + packages
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Amiri-Bold.ttf    https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf &
          curl -fsSL -o fonts/Amiri-Regular.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf &
          pip install -q -r requirements.txt
          wait
          python -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)" \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0)

      - name: Handle message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BOT_CHAT: ${{ github.event.client_payload.chat }}
          BOT_TEXT: ${{ github.event.client_payload.text }}
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          python bot.py
