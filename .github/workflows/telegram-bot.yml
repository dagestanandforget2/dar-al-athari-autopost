name: Telegram bot commands

# Checks your bot's DMs every 5 minutes (GitHub sometimes runs it a few minutes late).
# Free: this repo is public, so GitHub Actions minutes don't count against any limit.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Any new messages?
        id: check
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          resp=$(curl -fsS "https://api.telegram.org/bot$TOKEN/getUpdates?timeout=0")
          n=$(echo "$resp" | jq '[.result[] | select(.message.chat.type == "private" and .message.text != null)] | length')
          total=$(echo "$resp" | jq '.result | length')
          if [ "$n" -gt 0 ]; then
            echo "work=true" >> "$GITHUB_OUTPUT"
          else
            echo "work=false" >> "$GITHUB_OUTPUT"
            # clear channel/other updates so they never pile up
            if [ "$total" -gt 0 ]; then
              last=$(echo "$resp" | jq '.result[-1].update_id')
              curl -fsS -o /dev/null "https://api.telegram.org/bot$TOKEN/getUpdates?offset=$((last + 1))&timeout=0"
            fi
          fi

      - if: steps.check.outputs.work == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.check.outputs.work == 'true'
        name: Install Arabic text shaping + fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0
          mkdir -p fonts
          curl -fsSL -o fonts/Amiri-Bold.ttf    https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          curl -fsSL -o fonts/Amiri-Regular.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          pip install -q -r requirements.txt

      - if: steps.check.outputs.work == 'true'
        name: Handle messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          python bot.py
