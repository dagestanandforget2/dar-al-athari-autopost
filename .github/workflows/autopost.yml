name: Post a book

on:
  # Started on time by the Cloudflare Worker at 12:20 PM and 7:15 PM New York time.
  # (GitHub's own schedule ran hours late, so it isn't used for posting.)
  repository_dispatch:
    types: [scheduled-post]
  workflow_dispatch:
    inputs:
      book:
        description: "Book name (leave empty for a random book)"
        type: string
        required: false
      mode:
        description: "What to do"
        type: choice
        options: [telegram only, post to both, instagram only, test image only]
        default: telegram only

permissions:
  contents: write

concurrency: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Amiri fonts are stored in fonts/ in this repo, so nothing is downloaded at post time.
      - name: Install Arabic text shaping
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0

      - run: pip install -q -r requirements.txt

      - name: Post
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          BOOK: ${{ inputs.book }}
          DRY_RUN: ${{ inputs.mode == 'test image only' && '1' || '0' }}
          SKIP_IG: ${{ inputs.mode == 'telegram only' && '1' || '0' }}
          SKIP_TELEGRAM: ${{ inputs.mode == 'instagram only' && '1' || '0' }}
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          python post.py

      - name: Save story image for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-image
          path: stories/*.jpg
          retention-days: 7

      # Tells the Shelf Locator dashboard whether this run posted. Does nothing until the
      # AUTOMATION_SECRET secret is added, and can never fail the run.
      - name: Report run to Shelf Locator
        if: always() && inputs.mode != 'test image only'
        continue-on-error: true
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          POSTED_TITLE: ${{ steps.post.outputs.title }}
        run: |
          [ -n "$AUTOMATION_SECRET" ] || exit 0
          python3 - <<'PY'
          import json, os, urllib.request
          # The stored secret can carry an invisible byte-order mark or line ending
          # (it was saved from Windows); strip those so the header is valid.
          secret = os.environ["AUTOMATION_SECRET"].replace("\ufeff", "").strip()
          ok = os.environ.get("POST_OUTCOME") == "success"
          title = os.environ.get("POSTED_TITLE", "")
          if ok:
              details = f"Posted: {title}" if title else "Posted"
          else:
              details = f"Post failed: {title}" if title else "Post failed before a book was chosen"
          body = json.dumps({"automation": "telegram_post",
                             "status": "success" if ok else "failed",
                             "details": details[:300]}).encode()
          req = urllib.request.Request(
              "https://shelf-locator.vercel.app/api/automations/run", data=body, method="POST",
              headers={"Content-Type": "application/json",
                       "Authorization": "Bearer " + secret})
          try:
              print("Reported:", urllib.request.urlopen(req, timeout=20).status)
          except Exception as e:
              print("Could not report run:", e)
          PY

      - name: Tell the owner if a scheduled post failed
        if: failure() && github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_OWNER_ID" ] || exit 0
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_ID}" \
            --data-urlencode "text=⚠️ Autopost: the scheduled book post did not go out. DM me /random to post one now, or open GitHub → Actions → Post a book to see what went wrong." > /dev/null
