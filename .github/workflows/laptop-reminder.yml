name: Laptop reminder (New Arrivals email)

# The New Arrivals email task runs on the 1st and 15th at 1:23 PM ET and needs
# the laptop awake with the Claude app and Chrome open. This sends a Telegram DM
# the day before (on the 14th and the last day of each month) at about 1:30 PM ET.
on:
  schedule:
    - cron: "30 17 * * *"   # daily; the script only sends when tomorrow is the 1st or 15th
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder if tomorrow is the 1st or 15th (New York time)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, datetime
          from zoneinfo import ZoneInfo
          tomorrow = datetime.datetime.now(ZoneInfo("America/New_York")).date() + datetime.timedelta(days=1)
          if tomorrow.day not in (1, 15) and os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              print("Not the day before a run; nothing to send.")
              raise SystemExit(0)
          text = ("💻 Reminder: tomorrow (" + tomorrow.strftime("%a %b %-d") + ") at 1:23 PM ET the New Arrivals "
                  "email task runs on your laptop. Keep it awake and online with the Claude app open and Chrome running.")
          data = json.dumps({"chat_id": os.environ["TELEGRAM_OWNER_ID"], "text": text}).encode()
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=data, headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          EOF
